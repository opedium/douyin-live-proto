  string rp_id                         = 1;  // "RP3-260723105308092699312129269" 红包ID
  uint64 start_time                    = 2;  // 开始时间戳
  uint64 end_time                      = 3;  // 结束时间戳
  int32  count                         = 4;  // 红包数量 (5)
  int32  type                          = 5;  // 类型 (2)
  string currency                      = 6;  // 币种 "Diamond"
  string icon_url                      = 7;  // 红包图标URL
  string status_text                   = 8;  // "红包发放中"
  int32  total_amount                  = 9;  // 总额 (50)
  int32  unit_amount                   = 11; // 单个金额 (50)
}

// PreviewCjRpMessage: 红包预览消息（CjRp = 超级红包）
//   注意: common 在 field 2（非标准位置），红包信息在 field 1
message PreviewCjRpMessage {
  PreviewCjRpRedPacket red_packet_info = 1;
  Common common                        = 2;
}
message LuckyBoxMessage            { Common common = 1; }
message LuckyBoxEndMessage         { Common common = 1; }
message LuckyBoxRewardMessage      { Common common = 1; }
message LuckyBoxTempStatusMessage  { Common common = 1; }
