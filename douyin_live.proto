// ──────────────────────────────────────────────────────────────
// douyin_live.proto — 抖音直播间 WebSocket 全量 Protobuf 定义
//
// 来源：抖音 Web 端 WebSocket 协议逆向工程
// 覆盖：传输层 + 通用层 + 业务层（85+ 种消息类型）
// ──────────────────────────────────────────────────────────────

syntax = "proto3";

package douyin.live;

// ══════════════════════════════════════════════════════════════
// 传输层 — WebSocket 帧封装
// ══════════════════════════════════════════════════════════════

// PushFrame: WebSocket 传输帧，心跳包和消息包共用此结构。
//   payload_type = "hb" 表示心跳包
//   payload = gzip 压缩的 Response 序列化数据（消息包）
message PushFrame {
  uint64 seq_id          = 1;
  uint64 log_id          = 2;
  uint64 service         = 3;
  uint64 method          = 4;
  repeated HeadersList headers_list    = 5;
  string payload_encoding              = 6;
  string payload_type                  = 7;  // "hb" 为心跳，其他为消息
  bytes  payload                       = 8;  // gzip(Response) 或空
}

// HeadersList: 通用键值对头部字段
message HeadersList {
  string key   = 1;
  string value = 2;
}

// Response: WebSocket 响应体，包含消息列表和 ACK 控制字段
message Response {
  repeated Message messages_list       = 1;
  string cursor                        = 2;
  uint64 fetch_interval                = 3;
  uint64 now                           = 4;
  string internal_ext                  = 5;  // ACK 回送数据载荷
  uint32 fetch_type                    = 6;
  map<string, string> route_params     = 7;
  uint64 heartbeat_duration            = 8;
  bool   need_ack                      = 9;
  string push_server                   = 10;
  string live_cursor                   = 11;
  bool   history_no_more               = 12;
}

// Message: WebSocket 单条消息封装（嵌入 PushFrame.payload 解压后的 Response 中）
//   method  ⇒ 消息类型标识（如 'WebcastChatMessage'），用于分发
//   payload ⇒ protobuf 序列化的业务消息体
message Message {
  string method                        = 1;
  bytes  payload                       = 2;
  int64  msg_id                        = 3;
  int32  msg_type                      = 4;
  int64  offset                        = 5;
  bool   need_wrds_store               = 6;
  int64  wrds_version                  = 7;
  string wrds_sub_key                  = 8;
}

// ══════════════════════════════════════════════════════════════
// 通用层 — Image / Text / User / Common（被所有业务消息复用）
// ══════════════════════════════════════════════════════════════

// Image: 图片资源，包含多分辨率 URL 列表
message Image {
  repeated string url_list_list        = 1;
  string uri                           = 2;
  uint64 height                        = 3;
  uint64 width                         = 4;
  string avg_color                     = 5;
  uint32 image_type                    = 6;
  string open_web_url                  = 7;
  ImageContent content                 = 8;
  bool   is_animated                   = 9;
  NinePatchSetting flex_setting_list   = 10;
  NinePatchSetting text_setting_list   = 11;
}

// NinePatchSetting: 九宫格图片设置
message NinePatchSetting {
  repeated string setting_list_list    = 1;
}

// ImageContent: 图片内嵌文本内容
message ImageContent {
  string name                          = 1;
  string font_color                    = 2;
  uint64 level                         = 3;
  string alternative_text              = 4;
}

// TextFormat: 文本格式（颜色、加粗、字号等）
message TextFormat {
  string color                         = 1;
  bool   bold                          = 2;
  bool   italic                        = 3;
  uint32 weight                        = 4;
  uint32 italic_angle                  = 5;
  uint32 font_size                     = 6;
  bool   use_heigh_light_color         = 7;
  bool   use_remote_clor               = 8;
}

// TextPieceUser: 富文本中的用户引用片段
message TextPieceUser {
  User   user                          = 1;
  bool   with_colon                    = 2;
}

// TextPieceGift: 富文本中的礼物引用片段
message TextPieceGift {
  uint64    gift_id                    = 1;
  PatternRef name_ref                  = 2;
}

// PatternRef: 模板引用（用于动态拼接文本）
message PatternRef {
  string key                           = 1;
  string default_pattern               = 2;
}

// TextPieceHeart: 富文本中的爱心片段
message TextPieceHeart {
  string color                         = 1;
}

// TextPiecePatternRef: 富文本中的模板引用片段
message TextPiecePatternRef {
  string key                           = 1;
  string default_pattern               = 2;
}

// TextPieceImage: 富文本中的图片片段
message TextPieceImage {
  Image image                          = 1;
  float scaling_rate                   = 2;
}

// TextPiece: 富文本的单个片段
message TextPiece {
  bool        type                     = 1;
  TextFormat  format                   = 2;
  string      string_value             = 3;
  TextPieceUser    user_value          = 4;
  TextPieceGift    gift_value          = 5;
  TextPieceHeart   heart_value         = 6;
  TextPiecePatternRef pattern_ref_value = 7;
  TextPieceImage   image_value         = 8;
}

// Text: 富文本容器，由多个 TextPiece 拼接而成
message Text {
  string      key                      = 1;
  string      default_patter           = 2;
  TextFormat  default_format           = 3;
  repeated TextPiece pieces_list       = 4;
}

// FollowInfo: 用户关注信息
message FollowInfo {
  uint64 following_count               = 1;
  uint64 follower_count                = 2;
  uint64 follow_status                 = 3;
  uint64 push_status                   = 4;
  string remark_name                   = 5;
  string follower_count_str            = 6;
  string following_count_str           = 7;
}

// GradeIcon: 等级图标
message GradeIcon {
  Image icon                           = 1;
  int64 icon_diamond                   = 2;
  int64 level                          = 3;
  string level_str                     = 4;
}

// GradeBuffInfo: 等级增益信息
message GradeBuffInfo {
}

// PayGrade: 用户消费等级详情
message PayGrade {
  int64  total_diamond_count           = 1;
  Image  diamond_icon                  = 2;
  string name                          = 3;
  Image  icon                          = 4;
  string next_name                     = 5;
  int64  level                         = 6;
  Image  next_icon                     = 7;
  int64  next_diamond                  = 8;
  int64  now_diamond                   = 9;
  int64  this_grade_min_diamond        = 10;
  int64  this_grade_max_diamond        = 11;
  int64  pay_diamond_bak               = 12;
  string grade_describe                = 13;
  repeated GradeIcon grade_icon_list   = 14;
  int64  screen_chat_type              = 15;
  Image  im_icon                       = 16;
  Image  im_icon_with_level            = 17;
  Image  live_icon                     = 18;
  Image  new_im_icon_with_level        = 19;
  Image  new_live_icon                 = 20;
  int64  upgrade_need_consume          = 21;
  string next_privileges               = 22;
  Image  background                    = 23;
  Image  background_back               = 24;
  int64  score                         = 25;
  GradeBuffInfo buff_info              = 26;
  string grade_banner                  = 1001;
  Image  profile_dialog_bg             = 1002;
  Image  profile_dialog_bg_back        = 1003;
}

// UserBadge: 用户徽章
message UserBadge {
  map<int32, Image> icons              = 1;
  string title                         = 2;
}

// FansClubData: 粉丝团数据（单个主播的粉丝团）
message FansClubData {
  string club_name                     = 1;
  int32  level                         = 2;
  int32  user_fans_club_status         = 3;
  UserBadge badge                      = 4;
  repeated int64 available_gift_ids    = 5;
  int64  anchor_id                     = 6;
}

// FansClub: 粉丝团容器（支持多主播粉丝团）
message FansClub {
  FansClubData data                    = 1;
  map<int32, FansClubData> prefer_data = 2;
}

// User: 用户信息，被所有业务消息引用
message User {
  uint64 id                            = 1;
  uint64 short_id                      = 2;
  string nick_name                     = 3;
  uint32 gender                        = 4;
  string signature                     = 5;
  uint32 level                         = 6;
  uint64 birthday                      = 7;
  string telephone                     = 8;
  Image  avatar_thumb                  = 9;
  Image  avatar_medium                 = 10;
  Image  avatar_large                  = 11;
  bool   verified                      = 12;
  uint32 experience                    = 13;
  string city                          = 14;
  int32  status                        = 15;
  uint64 create_time                   = 16;
  uint64 modify_time                   = 17;
  uint32 secret                        = 18;
  string share_qrcode_uri              = 19;
  uint32 income_share_percent          = 20;
  repeated Image badge_image_list      = 21;
  FollowInfo follow_info               = 22;
  PayGrade  pay_grade                  = 23;
  FansClub  fans_club                  = 24;
  string special_id                    = 26;
  Image  avatar_border                 = 27;
  Image  medal                         = 28;
  repeated Image real_time_icons_list  = 29;
  string display_id                    = 38;
  string sec_uid                       = 46;
  uint64 fan_ticket_count              = 1022;
  string id_str                        = 1028;
  uint32 age_range                     = 1045;

  // Wire-observed fields (semantics not yet confirmed)
  string field_32                      = 32;
  uint32 field_37                      = 37;
  uint32 field_54                      = 54;
  uint32 field_55                      = 55;
  bytes  field_61                      = 61;
  bytes  field_64                      = 64;
  uint32 field_66                      = 66;
  string field_68                      = 68;
  string field_69                      = 69;
  string field_70                      = 70;
  string field_73                      = 73;  // Used for anonymous user cross-linking
  bytes  field_78                      = 78;
}

// Common: 公共字段，被所有业务消息引用
message Common {
  string method                        = 1;
  uint64 msg_id                        = 2;
  uint64 room_id                       = 3;
  uint64 create_time                   = 4;  // 秒级时间戳
  uint32 monitor                       = 5;
  bool   is_show_msg                   = 6;
  string describe                      = 7;
  bytes  display_text                  = 8;  // 嵌套 Text 对象（主播展示用）
  uint64 fold_type                     = 9;
  uint64 anchor_fold_type              = 10;
  uint64 priority_score                = 11;
  string log_id                        = 12;
  string msg_process_filter_k          = 13;
  string msg_process_filter_v          = 14;
  User   user                          = 15;
  uint64 anchor_fold_type_v2           = 17;
  uint64 process_at_sei_time_ms        = 18;
  uint64 random_dispatch_ms            = 19;
  bool   is_dispatch                   = 20;
  uint64 channel_id                    = 21;
  uint64 diff_sei2abs_second           = 22;
  uint64 anchor_fold_duration          = 23;
  uint64 field_24                      = 24;  // version/fold flag (1128)
}

// PublicAreaCommon: 公共区域通用字段
message PublicAreaCommon {
  Image  user_label                    = 1;
  uint64 user_consume_in_room          = 2;
  uint64 user_send_gift_cnt_in_room    = 3;
}

// LandscapeAreaCommon: 横屏模式下的公共区域字段
message LandscapeAreaCommon {
  bool   show_head                     = 1;
  bool   show_nickname                 = 2;
  bool   show_font_color               = 3;
  repeated string color_value_list     = 4;
  repeated int32  comment_type_tags_list = 5;
}

// EffectConfig: 进场/关注等特效配置
message EffectConfig {
  uint64 type                          = 1;
  Image  icon                          = 2;
  uint64 avatar_pos                    = 3;
  Text   text                          = 4;
  Image  text_icon                     = 5;
  uint32 stay_time                     = 6;
  uint64 anim_asset_id                 = 7;
  Image  badge                         = 8;
  repeated uint64 flex_setting_array_list = 9;
  Image  text_icon_overlay             = 10;
  Image  animated_badge                = 11;
  bool   has_sweep_light               = 12;
  repeated uint64 text_flex_setting_array_list = 13;
  uint64 center_anim_asset_id          = 14;
  Image  dynamic_image                 = 15;
  map<string, string> extra_map        = 16;
  uint64 mp4_anim_asset_id             = 17;
  uint64 priority                      = 18;
  uint64 max_wait_time                 = 19;
  string dress_id                      = 20;
  uint64 alignment                     = 21;
  uint64 alignment_offset              = 22;
}

