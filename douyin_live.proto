  Common common                        = 1;
  User   user                          = 2;
  string scene                         = 3;
}

// ─── 礼物消息 ───────────────────────────────────────

// GiftStruct: 礼物结构体
message GiftStruct {
  Image  image                         = 1;
  string describe                      = 2;
  bool   notify                        = 3;
  uint64 duration                      = 4;
  uint64 id                            = 5;
  bool   for_linkmic                   = 7;
  bool   doodle                        = 8;
  bool   for_fansclub                  = 9;
  bool   combo                         = 10;
  uint32 type                          = 11;
  uint32 diamond_count                 = 12;
  bool   is_displayed_on_panel         = 13;
  uint64 primary_effect_id             = 14;
  Image  gift_label_icon               = 15;
  string name                          = 16;
  string region                        = 17;
  string manual                        = 18;
  bool   for_custom                    = 19;
  Image  icon                          = 21;
  uint32 action_type                   = 22;

  // Extended gift metadata (wire-observed)
  uint32 display_index                 = 28;  // gift panel sort order
  uint64 fold_type                     = 38;  // 1128=normal
  uint32 gift_category_id              = 42;  // 753=fan badge
  string gift_label                    = 44;  // "粉丝","限定","热门"
  uint32 display_strategy              = 48;  // 3=normal
  string scheme_url                    = 52;
  uint32 gift_source                   = 54;  // 1=normal panel
  bytes  banner                        = 55;  // panel banner images
  bytes  tag_images                    = 56;  // tag image assets
  bytes  gift_tag                      = 57;
  uint32 sub_type                      = 63;
  bytes  anchor_gift_data              = 74;
}

// GiftIMPriority: 礼物 IM 优先级
