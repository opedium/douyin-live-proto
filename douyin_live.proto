  Common common                        = 1;
  User   user                          = 2;
  string content                       = 3;
  bool   visible_to_sender             = 4;
  Image  background_image              = 5;
  string full_screen_text_color        = 6;
  Image  background_image_v2           = 7;
  PublicAreaCommon public_area_common  = 9;
  Image  gift_image                    = 10;
  uint64 agree_msg_id                  = 11;
  uint32 priority_level                = 12;
  LandscapeAreaCommon landscape_area_common = 13;
  uint64 event_time                    = 15;
  bool   send_review                   = 16;
  bool   from_intercom                 = 17;
  bool   intercom_hide_user_card       = 18;
  uint32 chat_by                       = 20;
  uint32 individual_chat_priority      = 21;
  Text   rtf_content                   = 22;
}

// EmojiChatMessage: 表情消息
message EmojiChatMessage {
  Common common                        = 1;
  User   user                          = 2;
  int64  emoji_id                      = 3;
  Text   emoji_content                 = 4;
  string default_content               = 5;
  Image  background_image              = 6;
  bool   from_intercom                 = 7;
  bool   intercom_hide_user_card       = 8;
}

// ScreenChatMessage: 醒目留言/屏幕聊天（付费 spotlight 弹幕）
message ScreenChatMessage {
  Common common                        = 1;
  User   user                          = 2;
  string content                       = 3;
  uint64 event_time                    = 4;
  PublicAreaCommon public_area_common  = 10;
  uint64 priority_score                = 12;
  bytes  field_32                      = 32;  // rtf content
}

// HotChatMessage: "大家都在说" 话题建议
message HotChatMessage {
  Common common                        = 1;
  string title                         = 2;
  string content                       = 3;
  bytes  field_4                       = 4;
  uint32 field_5                       = 5;
  bytes  field_6                       = 6;
  uint64 event_time                    = 7;
  bytes  field_11                      = 11;
  bytes  field_200                     = 200;  // tag map
}

// EpisodeChatMessage: 剧集聊天消息（可能已废弃）
message EpisodeChatMessage {
  Message common                       = 1;  // 注意：此处为 Message 类型而非 Common
  User   user                          = 2;
  string content                       = 3;
  bool   visible_to_sende              = 4;
  Image  gift_image                    = 7;
  uint64 agree_msg_id                  = 8;
  repeated string color_value_list     = 9;
}

// CommonTextMessage: 通用文本消息
