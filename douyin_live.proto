// ══════════════════════════════════════════════════════════════
// 辅助层 — WebSocket 握手/身份认证结构（逆向所得，含义不明）
// ══════════════════════════════════════════════════════════════

// Kk: 含义不明的加密辅助字段
message Kk {
  uint32 k                            = 14;
}

// ExtList: 扩展键值对
message ExtList {
  string key                          = 1;
  string value                        = 2;
}

// RspF: 握手响应的未知子字段
message RspF {
  uint64 q1                           = 1;
  uint64 q3                           = 3;
  string q4                           = 4;
  uint64 q5                           = 5;
}

// Rsp: 握手响应体
message Rsp {
  int32  a                            = 1;
  int32  b                            = 2;
  int32  c                            = 3;
  string d                            = 4;
  int32  e                            = 5;
  RspF   f                            = 6;
  string g                            = 7;
  uint64 h                            = 10;
  uint64 i                            = 11;
  uint64 j                            = 13;
}

// SendMessageBody: 消息发送体
message SendMessageBody {
  string conversation_id              = 1;
  uint32 conversation_type            = 2;
  uint64 conversation_short_id        = 3;
  string content                      = 4;
  repeated ExtList ext                = 5;
  uint32 message_type                 = 6;
  string ticket                       = 7;
  string client_message_id            = 8;
}

// PreMessage: 消息预处理结构（用于 WebSocket 握手认证）
message PreMessage {
  uint32 cmd                          = 1;
  uint32 sequence_id                  = 2;
  string sdk_version                  = 3;
  string token                        = 4;
  uint32 refer                        = 5;
  uint32 inbox_type                   = 6;
  string build_number                 = 7;
  SendMessageBody send_message_body   = 8;
  string aa                           = 9;
  string device_platform              = 11;
  repeated HeadersList headers        = 15;
  uint32 auth_type                    = 18;
  string biz                          = 21;
  string access                       = 22;
}

